
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Store</title>

<style>
*{
 box-sizing:border-box;
 margin:0;
 padding:0;
}

body{
 font-family:Arial,sans-serif;
 background:#f8f7fc;
 color:#20202a;
 padding-bottom:100px;
}

header{
 position:sticky;
 top:0;
 z-index:10;
 height:76px;
 background:white;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:10px 14px;
 box-shadow:0 2px 8px #ddd;
 gap:8px;
}

.logo{
 font-size:19px;
 font-weight:900;
 color:#44218c;
 white-space:nowrap;
}

.balance{
 background:#f00b68;
 color:white;
 border-radius:30px;
 padding:13px 14px;
 font-weight:bold;
 white-space:nowrap;
}

.profile{
 width:48px;
 height:48px;
 border-radius:50%;
 object-fit:cover;
 border:2px solid #9026ed;
 box-shadow:0 0 10px #b76aff;
 flex-shrink:0;
}

.notice{
 margin:22px 15px;
 background:linear-gradient(90deg,#ed0757,#f00083);
 color:white;
 padding:16px;
 border-radius:30px;
 text-align:center;
 font-weight:bold;
}

.banner{
 margin:15px;
 border-radius:16px;
 overflow:hidden;
 background:#170629;
 box-shadow:0 5px 18px #cbb5e8;
}

.banner img{
 width:100%;
 height:auto;
 display:block;
}

.categories{
 display:flex;
 gap:10px;
 overflow-x:auto;
 padding:10px 15px;
 scrollbar-width:none;
}

.categories::-webkit-scrollbar{
 display:none;
}

.category{
 background:white;
 border:1px solid #ddd;
 border-radius:30px;
 padding:13px 22px;
 white-space:nowrap;
 flex-shrink:0;
}

.category.active{
 background:linear-gradient(100deg,#7025d6,#2472ed);
 color:white;
 border:0;
}

h2{
 text-align:center;
 margin:22px 0 8px;
}

.underline{
 width:80px;
 height:5px;
 background:linear-gradient(90deg,#f00082,#7929ed);
 margin:auto;
 border-radius:10px;
}

.products{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:12px;
 padding:15px;
}

.card{
 background:white;
 border:1px solid #ebd4e2;
 border-radius:15px;
 overflow:hidden;
 box-shadow:0 3px 8px #ddd;
}

.product-image{
 height:135px;
 background:linear-gradient(140deg,#16052c,#7123a9);
 display:flex;
 align-items:center;
 justify-content:center;
 color:white;
 font-size:34px;
}

.info{
 padding:12px;
}

.name{
 text-align:center;
 background:#f7f8fb;
 border:1px solid #eee;
 border-radius:30px;
 padding:11px 4px;
 font-size:13px;
 font-weight:bold;
}

.price{
 text-align:center;
 color:#239a60;
 font-size:22px;
 font-weight:bold;
 margin:18px 0;
}

.file,.buy{
 display:block;
 text-align:center;
 padding:12px 3px;
 border-radius:10px;
 color:white;
 text-decoration:none;
 font-size:13px;
 font-weight:bold;
 margin-top:10px;
}

.file{
 background:linear-gradient(90deg,#2675eb,#7923d9);
}

.buy{
 background:linear-gradient(90deg,#f00088,#f51a4a);
}

nav{
 position:fixed;
 bottom:8px;
 left:3%;
 width:94%;
 background:#ffffffed;
 box-shadow:0 2px 20px #bbb;
 border-radius:35px;
 display:flex;
 justify-content:space-around;
 padding:13px 3px;
 z-index:20;
}

nav button{
 border:0;
 background:none;
 color:#707080;
 font-size:11px;
 display:flex;
 flex-direction:column;
 align-items:center;
 gap:5px;
}

nav span{
 font-size:22px;
}

nav .selected{
 color:#e71954;
}

.support{
 position:fixed;
 right:15px;
 bottom:105px;
 background:#ed0872;
 color:white;
 border:4px solid white;
 border-radius:50%;
 width:57px;
 height:57px;
 font-size:25px;
 z-index:15;
}

@media(max-width:350px){
 .products{
  grid-template-columns:1fr;
 }
 .logo{
  font-size:16px;
 }
 .balance{
  padding:11px;
 }
}
</style>
</head>

<body>

<header>
 <div class="logo">⚡ PANEL STORE</div>

 <div class="balance">
  ▣ ৳ <span id="balance">0</span>
 </div>

 <img
  class="profile"
  src="panel-store-profile.png"
  alt="Profile Picture"
 >
</header>

<div class="notice">
 📢 NOTICE: Welcome to Panel Store!
</div>

<section class="banner">
 <img
  src="panel-store-cover.png"
  alt="Panel Store Premium Banner"
 >
</section>

<div class="categories">

 <button class="category active"
 onclick="filter('ALL',this)">
 ALL
 </button>

 <button class="category"
 onclick="filter('NON ROOT',this)">
 NON ROOT
 </button>

 <button class="category"
 onclick="filter('ROOT',this)">
 ROOT
 </button>

 <button class="category"
 onclick="filter('IPHONE',this)">
 IPHONE
 </button>

 <button class="category"
 onclick="filter('PC',this)">
 PC
 </button>

</div>

<h2>OUR PRODUCTS</h2>
<div class="underline"></div>

<section class="products" id="products"></section>

<button class="support"
 onclick="alert('Support link will be added later')">
 ➤
</button>

<nav>

 <button class="selected" onclick="showPage('Home')">
  <span>⌂</span>
  Home
 </button>

 <button onclick="showPage('My Orders')">
  <span>▣</span>
  My Order
 </button>

 <button onclick="showPage('Add Fund')">
  <span>＋</span>
  Add Fund
 </button>

 <button onclick="showPage('My Keys')">
  <span>⚿</span>
  My Keys
 </button>

 <button onclick="showPage('Account')">
  <span>♙</span>
  Account
 </button>

</nav>

<script>

const items=[
 {name:"Android Utility",price:100,cat:"NON ROOT",icon:"📱"},
 {name:"Software Tools",price:150,cat:"NON ROOT",icon:"🛠️"},
 {name:"Android Source Code",price:200,cat:"ROOT",icon:"💻"},
 {name:"License Package",price:120,cat:"PC",icon:"🔑"},
 {name:"iOS Utility",price:180,cat:"IPHONE",icon:"📲"},
 {name:"Web Source Code",price:250,cat:"PC",icon:"🌐"}
];

function render(data){

 document.getElementById("products").innerHTML=
 data.map((p,i)=>`

 <article class="card">

  <div class="product-image">
   ${p.icon}
  </div>

  <div class="info">

   <div class="name">
    ${p.name}
   </div>

   <div class="price">
    PRICE ৳${p.price}
   </div>

   <a href="#" class="file"
   onclick="details('${p.name}');return false">
   ▶ FILE & SETUP
   </a>

   <a href="#" class="buy"
   onclick="buy('${p.name}');return false">
   🛒 BUY NOW
   </a>

  </div>

 </article>

 `).join("");

}

function filter(cat,button){

 document.querySelectorAll(".category")
 .forEach(x=>x.classList.remove("active"));

 button.classList.add("active");

 render(
  cat==="ALL"
  ?items
  :items.filter(x=>x.cat===cat)
 );

}

function details(name){

 alert(name+" — Product details coming soon.");

}

function buy(name){

 alert("You selected "+name+
 "\nOrder system will be connected later.");

}

function showPage(name){

 alert(name+" page will be added in the next version.");

}

render(items);

</script>

</body>
</html>
