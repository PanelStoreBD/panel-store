
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Store</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
 font-family:Arial,sans-serif;
 background:#f8f7fc;
 color:#20202a;
 padding-bottom:110px;
}

header{
 position:sticky;
 top:0;
 z-index:10;
 height:76px;
 background:white;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:10px 14px;
 box-shadow:0 2px 8px #ddd;
}

.logo{
 font-size:21px;
 font-weight:900;
 color:#5420a0;
}

.balance{
 background:#ed0872;
 color:white;
 border-radius:30px;
 padding:14px 17px;
 font-weight:bold;
}

.profile{
 width:48px;
 height:48px;
 border-radius:50%;
 overflow:hidden;
 border:2px solid #d7b5ff;
 flex-shrink:0;
}

.profile img{
 width:100%;
 height:100%;
 object-fit:cover;
 display:block;
}

.notice{
 margin:20px 15px;
 background:linear-gradient(90deg,#ed075d,#ff245e);
 color:white;
 padding:17px;
 border-radius:30px;
 text-align:center;
 font-weight:bold;
}

.banner{
 margin:15px;
 border-radius:17px;
 background:
 linear-gradient(#0005,#0005),
 url("banner.png") center/cover no-repeat;
 color:white;
 text-align:center;
 padding:40px 12px;
 min-height:185px;
 display:flex;
 flex-direction:column;
 justify-content:center;
 gap:14px;
 box-shadow:0 5px 18px #bda1d9;
}

.banner h1{font-size:30px}
.banner p{font-size:15px}
.banner b{font-size:14px}

.categories{
 display:flex;
 gap:10px;
 overflow-x:auto;
 padding:12px 15px;
 scrollbar-width:none;
}

.category{
 background:white;
 border:1px solid #ddd;
 border-radius:30px;
 padding:13px 23px;
 white-space:nowrap;
 font-size:14px;
}

.category.active{
 background:linear-gradient(100deg,#7025d6,#2472ed);
 color:white;
 border:0;
}

h2{
 text-align:center;
 margin:25px 0 8px;
 font-size:25px;
}

.underline{
 width:80px;
 height:5px;
 background:linear-gradient(90deg,#f00082,#7929ed);
 margin:auto;
 border-radius:10px;
}

.products{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:13px;
 padding:15px;
}

.card{
 background:white;
 border:1px solid #ead9ee;
 border-radius:18px;
 overflow:hidden;
 box-shadow:0 4px 12px #ddd;
}

.product-image{
 width:100%;
 aspect-ratio:1/1;
 background:linear-gradient(140deg,#16052c,#7123a9);
 overflow:hidden;
}

.product-image img{
 width:100%;
 height:100%;
 object-fit:cover;
 display:block;
}

.info{padding:12px}

.name{
 display:flex;
 align-items:center;
 justify-content:center;
 min-height:48px;
 text-align:center;
 background:#f7f8fb;
 border:1px solid #eee;
 border-radius:30px;
 padding:10px 5px;
 font-size:13px;
 font-weight:bold;
}

.price{
 text-align:center;
 color:#239a60;
 font-size:23px;
 font-weight:bold;
 margin:20px 0;
}

.file,.buy{
 display:block;
 text-align:center;
 padding:14px 3px;
 border-radius:11px;
 color:white;
 text-decoration:none;
 font-size:13px;
 font-weight:bold;
 margin-top:10px;
}

.file{
 background:linear-gradient(90deg,#2675eb,#7923d9);
}

.buy{
 background:linear-gradient(90deg,#f00088,#f51a4a);
}

.support{
 position:fixed;
 right:15px;
 bottom:105px;
 background:#ed0872;
 color:white;
 border:4px solid white;
 border-radius:50%;
 width:57px;
 height:57px;
 font-size:25px;
 z-index:15;
}

nav{
 position:fixed;
 bottom:8px;
 left:3%;
 width:94%;
 background:#ffffffed;
 box-shadow:0 2px 20px #bbb;
 border-radius:35px;
 display:flex;
 justify-content:space-around;
 padding:13px 3px;
 z-index:20;
}

nav button{
 border:0;
 background:none;
 color:#707080;
 font-size:11px;
 display:flex;
 flex-direction:column;
 align-items:center;
 gap:5px;
}

nav span{font-size:22px}
nav .selected{color:#e71954}

@media(max-width:350px){
 .products{grid-template-columns:1fr}
 .logo{font-size:17px}
}
</style>
</head>

<body>

<header>
 <div class="logo">⚡ PANEL STORE</div>

 <div class="balance">
  ▣ ৳ <span id="balance">0</span>
 </div>

 <div class="profile">
  <img src="profile.png" alt="Profile Picture">
 </div>
</header>

<div class="notice">
 📢 NOTICE: Welcome to Panel Store!
</div>

<section class="banner">
 <h1>⚡ PANEL STORE</h1>
 <p>YOUR DIGITAL PRODUCTS MARKETPLACE</p>
 <b>FAST SERVICE • SECURE ORDER</b>
</section>

<div class="categories">
 <button class="category active" onclick="filter('ALL',this)">ALL</button>
 <button class="category" onclick="filter('NON ROOT',this)">NON ROOT</button>
 <button class="category" onclick="filter('ROOT',this)">ROOT</button>
 <button class="category" onclick="filter('IPHONE',this)">IPHONE</button>
 <button class="category" onclick="filter('PC',this)">PC</button>
</div>

<h2>OUR PRODUCTS</h2>
<div class="underline"></div>

<section class="products" id="products"></section>

<button class="support" onclick="alert('Support link will be added later')">➤</button>

<nav>
 <button class="selected" onclick="showPage('Home',this)">
  <span>⌂</span>Home
 </button>
 <button onclick="showPage('My Orders',this)">
  <span>▣</span>My Order
 </button>
 <button onclick="showPage('Add Fund',this)">
  <span>＋</span>Add Fund
 </button>
 <button onclick="showPage('My Keys',this)">
  <span>⚿</span>My Keys
 </button>
 <button onclick="showPage('Account',this)">
  <span>♙</span>Account
 </button>
</nav>

<script>

const items=[
 {name:"AIM HACK",price:20,cat:"NON ROOT",img:"aim-hack.png"},
 {name:"DRIP WIRE",price:25,cat:"NON ROOT",img:"drip-wire.png"},
 {name:"REZZX MODS PANEL",price:20,cat:"NON ROOT",img:"rezzx-mods.png"},
 {name:"PHANTOM ANDROID IOS",price:30,cat:"IPHONE",img:"phantom-panel.png"},
 {name:"X-REG NON ROOT",price:15,cat:"NON ROOT",img:"x-reg.png"},
 {name:"BALA MODS - NON ROOT",price:20,cat:"NON ROOT",img:"bala-mods.png"}
];

function render(data){
 document.getElementById("products").innerHTML=
 data.map(p=>`
 <article class="card">
  <div class="product-image">
   <img src="${p.img}" alt="${p.name}"
   onerror="this.style.display='none';this.parentElement.innerHTML='⚠️ Image not found';">
  </div>
  <div class="info">
   <div class="name">${p.name}</div>
   <div class="price">PRICE ৳${p.price}</div>
   <a href="#" class="file"
   onclick="details('${p.name}');return false">
   ▶ FILE & SETUP
   </a>
   <a href="#" class="buy"
   onclick="buy('${p.name}');return false">
   🛒 BUY NOW
   </a>
  </div>
 </article>
 `).join("");
}

function filter(cat,button){
 document.querySelectorAll(".category")
 .forEach(x=>x.classList.remove("active"));

 button.classList.add("active");

 render(cat==="ALL"?items:items.filter(x=>x.cat===cat));
}

function details(name){
 alert(name+" — Product details coming soon.");
}

function buy(name){
 alert("You selected "+name+
 "\nOrder system will be connected later.");
}

function showPage(name,button){
 document.querySelectorAll("nav button")
 .forEach(x=>x.classList.remove("selected"));

 button.classList.add("selected");

 if(name==="Home"){
  window.scrollTo({top:0,behavior:"smooth"});
 }else{
  alert(name+" page will be added in the next version.");
 }
}

render(items);

</script>
</body>
</html>
