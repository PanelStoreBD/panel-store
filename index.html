
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PANEL STORE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f8f7fc;font-family:Arial}
header{background:white;padding:18px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:22px;font-weight:bold;color:#6522c9}
.balance{background:#f20b69;color:white;padding:12px 18px;border-radius:30px}
.notice{margin:20px 15px;background:#e81750;color:white;padding:15px;border-radius:30px;text-align:center}
.banner{margin:15px;background:linear-gradient(120deg,#16052c,#9226e9);color:white;text-align:center;padding:45px 10px;border-radius:15px}
.categories{display:flex;gap:10px;overflow:auto;padding:15px}
.categories button{padding:13px 22px;border:1px solid #ddd;border-radius:30px;background:white;white-space:nowrap}
.categories .active{background:#7025d6;color:white}
h2{text-align:center}
.products{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:15px}
.card{background:white;border:1px solid #ead5e7;border-radius:15px;overflow:hidden;padding:10px}
.pic{height:130px;background:linear-gradient(140deg,#18052e,#8b25df);display:grid;place-items:center;color:white;font-size:40px;border-radius:10px}
.name{text-align:center;margin:12px 0;background:#f5f5f8;padding:12px;border-radius:25px}
.price{text-align:center;color:#21965b;font-size:22px;font-weight:bold;margin:15px}
a{display:block;text-align:center;padding:13px;color:white;text-decoration:none;border-radius:9px;margin-top:9px}
.file{background:linear-gradient(90deg,#2675eb,#7923d9)}
.buy{background:linear-gradient(90deg,#f00088,#f51a4a)}
nav{position:fixed;bottom:8px;left:3%;width:94%;background:white;border-radius:30px;display:flex;justify-content:space-around;padding:14px 2px;box-shadow:0 0 15px #bbb}
nav button{border:0;background:none;font-size:11px;color:#555}
nav span{display:block;font-size:22px;margin-bottom:5px}
@media(max-width:350px){.products{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<div class="logo">⚡ PANEL STORE</div>
<div class="balance">▣ ৳ 0</div>
<div>PS</div>
</header>

<div class="notice">📢 Welcome to Panel Store!</div>

<div class="banner">
<h1>PANEL STORE</h1>
<p>YOUR DIGITAL PRODUCTS MARKETPLACE</p>
<b>FAST SERVICE • SECURE ORDER</b>
</div>

<div class="categories">
<button class="active" onclick="show('ALL')">ALL</button>
<button onclick="show('NON ROOT')">NON ROOT</button>
<button onclick="show('ROOT')">ROOT</button>
<button onclick="show('IPHONE')">IPHONE</button>
<button onclick="show('PC')">PC</button>
</div>

<h2>OUR PRODUCTS</h2>
<div class="products" id="products"></div>

<nav>
<button onclick="page('Home')"><span>⌂</span>Home</button>
<button onclick="page('My Orders')"><span>▣</span>My Order</button>
<button onclick="page('Add Fund')"><span>＋</span>Add Fund</button>
<button onclick="page('My Keys')"><span>⚿</span>My Keys</button>
<button onclick="page('Account')"><span>♙</span>Account</button>
</nav>

<script>
const data=[
{name:"Android Utility",price:100,cat:"NON ROOT",icon:"📱"},
{name:"Software Tools",price:150,cat:"NON ROOT",icon:"🛠️"},
{name:"Source Code",price:200,cat:"ROOT",icon:"💻"},
{name:"License Key",price:120,cat:"PC",icon:"🔑"},
{name:"iOS Utility",price:180,cat:"IPHONE",icon:"📲"},
{name:"Web Software",price:250,cat:"PC",icon:"🌐"}
];

function render(list){
document.getElementById("products").innerHTML=list.map(p=>`
<div class="card">
<div class="pic">${p.icon}</div>
<div class="name">${p.name}</div>
<div class="price">৳ ${p.price}</div>
<a class="file" href="#" onclick="alert('Product details coming soon');return false">▶ FILE & SETUP</a>
<a class="buy" href="#" onclick="alert('Ordering system coming soon');return false">🛒 BUY NOW</a>
</div>`).join("");
}
function show(cat){
render(cat==="ALL"?data:data.filter(p=>p.cat===cat));
}
function page(name){alert(name+" page coming soon");}
render(data);
</script>
</body>
</html>
